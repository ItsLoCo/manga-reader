<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Zero-Frame Manga Reader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Подключаем библиотеку MangaDex -->
    <script src="https://cdn.jsdelivr.net/npm/mangadex-full-api@5.0.0/dist/index.min.js"></script>
</head>
<body>

    <!-- Линия индикатора прогресса главы под Dynamic Island -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <!-- 1. ГЛАВНАЯ СТАРТОВАЯ СТРАНИЦА -->
    <div id="start-screen">
        <div class="welcome-container">
            <h1 class="logo-text">ZERO<span>READER</span></h1>
            <p class="sub-text">Твоя ультимативная читалка манхвы</p>
            
            <!-- Красивая поисковая строка по центру -->
            <div class="main-search-box">
                <input type="text" id="search-input" placeholder="Введите название манги...">
                <button id="search-btn">Найти 🔍</button>
            </div>
            
            <!-- Список найденных результатов -->
            <div id="search-results" class="hidden"></div>
        </div>
    </div>

    <!-- 2. ЭКРАН ЧТЕНИЯ (По умолчанию пустой и скрытый) -->
    <div id="reader-screen" class="hidden">
        <!-- Невидимый триггер по центру для вызова кнопок -->
        <div id="menu-trigger"></div>

        <!-- Контейнер для фреймов/страниц -->
        <div id="reader" class="mode-webtoon"></div>

        <!-- Минималистичная всплывающая панель управления -->
        <div id="reader-navigation" class="nav-hidden">
            <button id="nav-prev" class="nav-btn-mini" title="Назад">◀</button>
            <button id="nav-top" class="nav-btn-mini" title="В начало">🔝</button>
            <button id="nav-settings" class="nav-btn-mini style-gear" title="Настройки">⚙️</button>
            <button id="nav-next" class="nav-btn-mini" title="Вперед">▶</button>
        </div>
    </div>

    <!-- 3. ОКНО ОСТАЛЬНЫХ НАСТРОЕК -->
    <div id="settings-menu" class="hidden">
        <h3>Настройки чтения</h3>
        
        <div class="stats-box">
            <div>Глава: <span id="chapter-pct">0%</span></div>
            <div>Манга: <span id="manga-pct">0%</span></div>
        </div>
        
        <div class="setting-item">
            <label>Режим прокрутки:</label>
            <select id="scroll-mode">
                <option value="webtoon">Вертикальная лента (Вебтун)</option>
                <option value="paged-vertical">Постранично (Вертикально)</option>
                <option value="paged-horizontal">Постранично (Горизонтально)</option>
            </select>
        </div>
        
        <div class="setting-item">
            <label>Текущая глава:</label>
            <select id="chapter-select"></select>
        </div>

        <div class="setting-item">
            <label>Цвет фона:</label>
            <select id="bg-color">
                <option value="#000000">Абсолютно черный</option>
                <option value="#ffffff">Белый</option>
                <option value="#1a1a1a">Темно-серый</option>
            </select>
        </div>

        <div class="setting-item border-top">
            <label for="autoscroll-toggle">Автоматический скролл:</label>
            <input type="checkbox" id="autoscroll-toggle">
        </div>

        <div class="setting-item">
            <label for="autoscroll-speed">Скорость скролла:</label>
            <input type="range" id="autoscroll-speed" min="1" max="10" value="3">
        </div>
        
        <button id="close-menu">Вернуться к чтению</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
